    multiple_video_stream_allowed_extensions: "Comma-separated list of allowed video file extensions"
    multiple_video_stream_max_file_size: "Maximum allowed video file size in megabytes"
    multiple_video_stream_max_duration: "Maximum allowed video duration in seconds (e.g. 300 = 5 minutes, 3600 = 1 hour)"
    multiple_video_stream_keep_original_name: "Keep the original video file name on the streaming service"
    multiple_video_stream_intercept_native_uploads: "Automatically intercept native video uploads and redirect to video stream service"
