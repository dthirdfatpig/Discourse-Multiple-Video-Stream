      plugins: "Plugins"
    multiple_video_stream_enabled: "Enable video uploads and playback (Multiple Video Stream)"
    multiple_video_stream_provider: "Active streaming service provider for new uploads (Cloudflare, Bunny, or Hovod)"
    multiple_video_stream_hovod_api_url: "Hovod API URL or Server IP (e.g. http://192.168.1.100:3000 or https://hovod.example.com)"
