    multiple_video_stream_enable_live_streams: "Enable live stream creation with RTMP/RTMPS broadcasting support"
    enums:
      multiple_video_stream_provider:
        Cloudflare: "Cloudflare"
        Bunny: "Bunny"
        Hovod: "Hovod"
      video_stream_provider:
        Cloudflare: "Cloudflare"
        Bunny: "Bunny"
        Hovod: "Hovod"
