discourse_multiple_video_stream:
  multiple_video_stream_enabled:
    default: false
    client: true
  multiple_video_stream_provider:
    default: "Cloudflare"
    type: enum
    choices:
      - "Cloudflare"
      - "Bunny"
      - "Hovod"
    client: true

  # Hovod Connection Settings
  multiple_video_stream_hovod_api_url:
    default: ""
    client: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Hovod"
        - "hovod"
    depends_behavior: "hidden"
  multiple_video_stream_hovod_api_key:
    default: ""
    client: false
    secret: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Hovod"
        - "hovod"
    depends_behavior: "hidden"
  multiple_video_stream_hovod_hostname:
    default: ""
    client: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Hovod"
        - "hovod"
    depends_behavior: "hidden"
  multiple_video_stream_hovod_organization_id:
    default: ""
    client: false
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Hovod"
        - "hovod"
    depends_behavior: "hidden"

  # Cloudflare Connection Settings
  multiple_video_stream_account_id:
    default: ""
    client: false
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Cloudflare"
        - "cloudflare"
    depends_behavior: "hidden"
  multiple_video_stream_api_token:
    default: ""
    client: false
    secret: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Cloudflare"
        - "cloudflare"
    depends_behavior: "hidden"
  multiple_video_stream_customer_subdomain:
    default: ""
    client: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Cloudflare"
        - "cloudflare"
    depends_behavior: "hidden"

  # Bunny Connection Settings
  multiple_video_stream_bunny_library_id:
    default: ""
    client: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Bunny"
        - "bunny"
    depends_behavior: "hidden"
  multiple_video_stream_bunny_api_key:
    default: ""
    client: false
    secret: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Bunny"
        - "bunny"
    depends_behavior: "hidden"
  multiple_video_stream_bunny_hostname:
    default: ""
    client: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Bunny"
        - "bunny"
    depends_behavior: "hidden"

  # General Settings
  multiple_video_stream_allowed_extensions:
    default: "mp4,webm,mov"
    client: true
  multiple_video_stream_max_file_size:
    default: 500
    client: true
    min: 1
    max: 2000
  multiple_video_stream_max_duration:
    default: 300
    client: false
    min: 1
    max: 21600
  multiple_video_stream_keep_original_name:
    default: false
    client: true
  multiple_video_stream_intercept_native_uploads:
    default: true
    client: true
  multiple_video_stream_intercept_threshold_mb:
    default: 10
    client: true
    min: 1
    max: 2000
  multiple_video_stream_enable_live_streams:
    default: false
    client: true
    depends_on:
      - multiple_video_stream_provider
    depends_on_values:
      multiple_video_stream_provider:
        - "Cloudflare"
        - "cloudflare"
        - "Bunny"
        - "bunny"
    depends_behavior: "hidden"
